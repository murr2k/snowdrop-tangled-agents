[package]
name = "oracle-solver"
version = "0.1.0"
edition = "2021"
description = "AlphaQ Oracle Solver - Game tree enumeration for finding winning routes against deterministic opponents in the Tangled quantum game"

[dependencies]
rusqlite = { version = "0.31", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rayon = "1.8"
clap = { version = "4", features = ["derive"] }
log = "0.4"
env_logger = "0.11"
